name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - name: Install the pinned packages of environment.yml
        run: |
          python -m pip install --upgrade pip
          python -c "import yaml" 2>/dev/null || python -m pip install pyyaml
          python -c "import yaml; deps = yaml.safe_load(open('environment.yml'))['dependencies']; pins = next(d['pip'] for d in deps if isinstance(d, dict)); open('requirements-ci.txt', 'w').write('\n'.join(pins) + '\n')"
          python -m pip install -r requirements-ci.txt
      - name: Run the unit tests
        working-directory: scripts
        run: python -m pytest tests -q
